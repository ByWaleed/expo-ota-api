name: Build and push OTA API image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream (includes sequential-extraction fix)
        uses: actions/checkout@v4
        with:
          repository: umbertoghio/self-hosted-expo-updates-server
          ref: master
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./API
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bywaleed/expo-ota-api:latest
